<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexLoop V0 — interaction test bench</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font: 14px/1.55 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #14161a; color: #d6d9de; height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 10px 16px; background: #1d2026; border-bottom: 1px solid #2c313a;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; font-weight: 600; color: #e8eaee; }
  header .meta { font-size: 12px; color: #8b93a1; }
  #status {
    margin-left: auto; font-size: 12px; padding: 3px 10px; border-radius: 12px;
    background: #242a33; color: #8b93a1; border: 1px solid #2c313a; white-space: nowrap;
  }
  #status.busy { color: #ffd479; border-color: #66501f; background: #2a2415; }
  #status.err  { color: #ff8f8f; border-color: #663333; background: #2a1818; }
  main { flex: 1; display: flex; min-height: 0; }
  section { overflow-y: auto; padding: 14px 16px; }
  #transcript { flex: 1.4; border-right: 1px solid #2c313a; }
  #events    { flex: 1; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  .panel-title { font-size: 12px; color: #6c7482; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
  .msg { margin-bottom: 12px; display: flex; }
  .msg .bubble { max-width: 82%; padding: 8px 12px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { justify-content: flex-end; }
  .msg.user .bubble { background: #24456b; color: #e8f0fa; }
  .msg.assistant .bubble { background: #232933; color: #dfe3e9; border: 1px solid #2e3540; }
  .msg .tag { font-size: 10px; color: #5f6775; margin-top: 3px; }
  .msg.user .tag { text-align: right; }
  .ev { padding: 2px 0; color: #9aa2af; }
  .ev .t { color: #5f6775; }
  .ev.PLAN_CREATED     { color: #7fd1ff; }
  .ev.MESSAGE_SENT     { color: #b7e1a1; }
  .ev.PLAN_COMPLETED   { color: #7fe0c3; }
  .ev.USER_INTERRUPT   { color: #ffb86b; }
  .ev.PLAN_CANCELLED   { color: #ff7f7f; }
  .ev.REPLAN_STARTED   { color: #c9a9ff; }
  .ev.MODEL_ERROR      { color: #ff7f7f; }
  .ev.USER_MESSAGE     { color: #8ab4f8; }
  #empty-hint { color: #5f6775; font-size: 13px; }
  footer {
    padding: 10px 14px; border-top: 1px solid #2c313a; background: #1d2026;
    display: flex; gap: 10px;
  }
  #input {
    flex: 1; background: #232933; border: 1px solid #2e3540; color: #e6e9ee;
    border-radius: 8px; padding: 10px 12px; font-size: 14px; outline: none;
  }
  #input:focus { border-color: #4a7fbf; }
  #send {
    background: #2f6fb0; color: #fff; border: 0; border-radius: 8px; padding: 0 20px;
    font-size: 14px; cursor: pointer;
  }
  #send:active { background: #285f96; }
  @media (max-width: 760px) { main { flex-direction: column; } #transcript { border-right: 0; border-bottom: 1px solid #2c313a; } }
</style>
</head>
<body>
<header>
  <h1>NexLoop V0</h1>
  <span class="meta">split → schedule → interrupt → replan</span>
  <span id="status">idle</span>
</header>
<main>
  <section id="transcript">
    <div class="panel-title">Conversation (committed only)</div>
    <div id="chat"><div id="empty-hint">发送一条消息开始。AI 会分多条短消息发送；你可以在任意时刻插话，旧队列会被取消并重新规划。</div></div>
  </section>
  <section id="events">
    <div class="panel-title">Internal event log</div>
    <div id="log"></div>
  </section>
</main>
<footer>
  <input id="input" type="text" autocomplete="off" placeholder="输入消息，Enter 发送（发送中也可随时打断）">
  <button id="send">发送</button>
</footer>
<script>
(function () {
  'use strict';

  const chatEl = document.getElementById('chat');
  const logEl = document.getElementById('log');
  const inputEl = document.getElementById('input');
  const statusEl = document.getElementById('status');
  const emptyHint = document.getElementById('empty-hint');

  const MAX_EVENTS = 400;
  let planCounts = {}; // plan_id -> {total, sent}

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = cls || '';
  }

  function appendMsg(role, text, tag) {
    if (emptyHint) emptyHint.remove();
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    wrap.appendChild(bubble);
    if (tag) {
      const t = document.createElement('div');
      t.className = 'tag';
      t.textContent = tag;
      wrap.appendChild(t);
    }
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function appendEv(ev) {
    const row = document.createElement('div');
    row.className = 'ev ' + ev.event;
    const ts = new Date(ev.ts).toLocaleTimeString();
    let meta = ev.plan_id ? ' plan=' + ev.plan_id : '';
    if (ev.reason) meta += ' reason=' + ev.reason;
    if (ev.generation !== undefined) meta += ' gen=' + ev.generation;
    row.innerHTML = '<span class="t">' + ts + '</span> ' + ev.event + meta;
    logEl.appendChild(row);
    while (logEl.children.length > MAX_EVENTS) logEl.removeChild(logEl.firstChild);
    logEl.scrollTop = logEl.scrollHeight;
  }

  const es = new EventSource('/api/stream');

  es.addEventListener('MESSAGE_SENT', function (e) {
    const d = JSON.parse(e.data);
    const c = planCounts[d.plan_id];
    appendMsg('assistant', d.text, 'plan=' + d.plan_id + ' ' + (c ? c.sent : 0) + '/' + (c ? c.total : '?'));
    if (c) { c.sent++; setStatus('sending plan ' + d.plan_id + ' (' + c.sent + '/' + c.total + ')', 'busy'); }
  });

  es.addEventListener('PLAN_CREATED', function (e) {
    const d = JSON.parse(e.data);
    planCounts[d.plan_id] = { total: d.unit_count, sent: 0 };
    setStatus('sending plan ' + d.plan_id + ' (0/' + d.unit_count + ')', 'busy');
  });

  es.addEventListener('PLAN_COMPLETED', function (e) { setStatus('idle'); });
  es.addEventListener('PLAN_CANCELLED', function (e) { setStatus('idle'); });
  es.addEventListener('MODEL_ERROR', function () { setStatus('model error', 'err'); });

  // User messages are appended optimistically on send (see send()); the
  // server's USER_MESSAGE echo is used only for the event log, not the
  // transcript, to avoid double rendering.
  es.addEventListener('USER_MESSAGE', function (e) { /* echo only */ });
  es.addEventListener('USER_INTERRUPT', function (e) { const d = JSON.parse(e.data); setStatus('interrupted plan ' + d.plan_id + ' — replanning', 'busy'); });

  ['PLAN_CREATED','MESSAGE_SENT','PLAN_COMPLETED','USER_INTERRUPT','PLAN_CANCELLED','REPLAN_STARTED','MODEL_ERROR','USER_MESSAGE']
    .forEach(function (name) {
      es.addEventListener(name, function (e) { appendEv(JSON.parse(e.data)); });
    });

  es.onerror = function () { setStatus('stream disconnected — reconnecting…', 'err'); };

  function send() {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    appendMsg('user', text);
    fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    }).catch(function (err) {
      appendEv({ ts: new Date().toISOString(), event: 'CLIENT_ERROR', message: String(err) });
      setStatus('send failed', 'err');
    });
  }

  document.getElementById('send').addEventListener('click', send);
  inputEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); send(); } });

  // restore committed history on load
  fetch('/api/history')
    .then(function (r) { return r.json(); })
    .then(function (h) {
      for (const m of h.committedHistory) {
        appendMsg(m.role, m.content);
      }
      if (h.activePlan) {
        setStatus('plan ' + h.activePlan.id + ' in flight (' + h.activePlan.delivered + '/' + h.activePlan.unitCount + ')', 'busy');
      }
    })
    .catch(function () { /* ignore */ });
})();
</script>
</body>
</html>
